function adminChatWith(uid) {
  if (!checkAdminPermission(currentUser, 'chatWithUsers')) { notify('دسترسی نداری'); return; }
  const isRealAdmin = isRootAdmin();
  const adminUid = isRealAdmin ? ADMIN_USER.uid : currentUser.uid;
  const chat = DB.getOrCreateChat(adminUid, uid);
  currentChatId = chat.id;
  currentChatUserId = uid;
  openChatAsAdmin(chat, uid);
}

function openChatAsAdmin(chat, otherUid) {
  const other = DB.getUserById(otherUid);
  document.querySelectorAll('.chat-item').forEach(el => el.classList.toggle('active', el.dataset.chatId === chat.id));
  if (window.innerWidth <= 768) $('sidebar').classList.add('mobile-hidden');

  const isRealAdmin = isRootAdmin();
  const displayName = other?.name || 'کاربر';
  const imgSrc = getImageSrc(other?.photoURL);
  const avatarHtml = imgSrc ? `<img src="${imgSrc}">` : escapeHtml(displayName[0].toUpperCase());
  const badge = isRealAdmin ? '👑 ADMIN' : '🛡️ ADMIN';

  $('chatWindow').innerHTML = `
    <div class="chat-header">
      <button class="mobile-back" id="mobileBack">←</button>
      <div class="avatar admin-avatar">${avatarHtml}</div>
      <div class="chat-header-info">
        <h3>${escapeHtml(displayName)} <span class="admin-badge">${badge}</span></h3>
        <div class="status admin-status">ارسال به‌عنوان ادمین</div>
      </div>
    </div>
    <div class="messages-container" id="messagesContainer"></div>
    <div class="message-input-area">
      <input type="text" id="msgInput" placeholder="پیام به‌عنوان ادمین..." style="border:2px solid #f59e0b;">
      <button class="send-btn" id="sendBtn" style="background:linear-gradient(135deg, #f59e0b, #ef4444);">➤</button>
    </div>
  `;

  $('mobileBack').onclick = () => $('sidebar').classList.remove('mobile-hidden');
  renderMessages(chat.id);
  $('sendBtn').onclick = () => sendAdminMessage(chat.id, otherUid);
  $('msgInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendAdminMessage(chat.id, otherUid); });
  $('msgInput').focus();
}

async function sendAdminMessage(chatId, otherUid) {
  const input = $('msgInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  const isRealAdmin = isRootAdmin();
  const chat = DB.getChatById(chatId);
  const disappearTimer = chat?.disappearTimer || 0;
  const encrypted = await encryptText(text);

  const message = {
    id: genMsgId(), text: encrypted, type: 'text',
    senderId: isRealAdmin ? ADMIN_USER.uid : currentUser.uid,
    senderName: isRealAdmin ? '👑 ADMIN' : currentUser.name,
    timestamp: Date.now(), readBy: [], reactions: {},
    isAdminMessage: isRealAdmin,
    disappearAt: disappearTimer > 0 ? Date.now() + disappearTimer * 1000 : null
  };

  DB.addMessage(chatId, message);
  DB.updateChat(chatId, { lastMessage: { ...message, text: '🔒 پیام' } });
  broadcast('messages-update', { chatId });
  renderMessages(chatId);
  renderChats();
  if (isRealAdmin) notify('👑 پیام ادمین ارسال شد', true);
}

function adminViewUserChats(u) {
  if (!checkAdminPermission(currentUser, 'viewUserChats')) { notify('دسترسی نداری'); return; }
  const chats = DB.getChats().filter(c => c.participants.includes(u.uid));
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="modal-content">
      <div class="modal-header"><h3>👁️ چت‌های ${escapeHtml(u.name)}</h3><button class="close-btn">✕</button></div>
      <div class="modal-body">
        ${chats.length === 0 ? '<p style="text-align:center;color:var(--text-muted);">چتی ندارد</p>' : ''}
        ${chats.map(c => {
          let name;
          if (c.type === 'group') name = '👥 ' + c.name;
          else {
            const otherId = c.participants.find(p => p !== u.uid);
            name = '💬 ' + (DB.getUserById(otherId)?.name || 'کاربر');
          }
          const msgs = DB.getMessages(c.id);
          return `<div class="chat-item" data-chat-id="${c.id}" style="border-radius:10px;margin-bottom:6px;background:var(--bg-2);">
            <div class="chat-item-info">
              <div class="chat-item-name">${escapeHtml(name)}</div>
              <div class="chat-item-last">${msgs.length} پیام</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
  modal.querySelector('.close-btn').onclick = () => modal.remove();
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
  modal.querySelectorAll('.chat-item').forEach(el => {
    el.onclick = () => { modal.remove(); adminOpenChatReadOnly(el.dataset.chatId); };
  });
  document.body.appendChild(modal);
}

async function adminOpenChatReadOnly(chatId) {
  const chat = DB.getChatById(chatId);
  if (!chat) return;
  let displayName, initial;
  if (chat.type === 'group') { displayName = '👥 ' + chat.name; initial = '👥'; }
  else {
    const otherId = chat.participants.find(p => p !== currentUser.uid);
    const other = DB.getUserById(otherId);
    displayName = other?.name || 'کاربر';
    initial = (other?.name || 'ک')[0].toUpperCase();
  }

  $('chatWindow').innerHTML = `
    <div class="chat-header">
      <button class="mobile-back" id="mobileBack">←</button>
      <div class="avatar admin-avatar">${escapeHtml(initial)}</div>
      <div class="chat-header-info">
        <h3>${escapeHtml(displayName)} <span class="admin-badge">👁️ VIEW</span></h3>
        <div class="status admin-status">حالت مشاهده</div>
      </div>
      <button class="icon-btn" id="adminCloseChat" style="color:#ef4444;">✕</button>
    </div>
    <div class="messages-container" id="messagesContainer"></div>
  `;

  $('mobileBack').onclick = () => $('sidebar').classList.remove('mobile-hidden');
  $('adminCloseChat').onclick = () => {
    currentChatId = null; currentChatUserId = null;
    $('chatWindow').innerHTML = `<div class="no-chat-selected"><div class="no-chat-icon">💬</div><p>چت رو انتخاب کن</p></div>`;
    renderChats();
  };

  const messages = DB.getMessages(chatId);
  await ensureDecrypted(messages);
  const container = $('messagesContainer');
  container.innerHTML = '';
  messages.forEach(msg => {
    const sender = DB.getUserById(msg.senderId);
    const isAdminMsg = isFromAdmin(msg);
    const wrapper = document.createElement('div');
    wrapper.className = 'message-wrapper received';
    wrapper.dataset.msgId = msg.id;
    wrapper.style.alignSelf = 'flex-start';

    if (msg.deleted) {
      wrapper.innerHTML = `<div class="message deleted-msg" style="opacity:0.5;">🗑️ پیام حذف شده<span class="time">${formatTime(msg.timestamp)}</span></div>`;
    } else {
      const adminStyle = isAdminMsg ? 'background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff;' : '';
      const plainText = getPlainText(msg);
      wrapper.innerHTML = `
        <div class="message" style="${adminStyle}">
          <div class="sender-name" style="color:${isAdminMsg ? '#fff' : 'var(--primary)'};">
            ${escapeHtml(sender?.name || 'کاربر')} ${isAdminMsg ? '👑' : ''}
          </div>
          ${renderMarkdown(plainText)}
          <span class="time">${formatTime(msg.timestamp)}</span>
        </div>
      `;
    }

    wrapper.querySelector('.message').addEventListener('contextmenu', (e) => {
      e.preventDefault();
      showAdminContextMenu(e.clientX, e.clientY, msg, chatId);
    });
    container.appendChild(wrapper);
  });
  container.scrollTop = container.scrollHeight;
}

function showAdminContextMenu(x, y, msg, chatId) {
  document.querySelectorAll('.context-menu').forEach(el => el.remove());
  const menu = document.createElement('div');
  menu.className = 'context-menu';
  menu.style.left = Math.min(x, window.innerWidth - 240) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - 200) + 'px';
  const canEdit = checkAdminPermission(currentUser, 'editAnyMessage') || isRootAdmin();
  const canDelete = checkAdminPermission(currentUser, 'deleteAnyMessage') || isRootAdmin();
  const items = [];
  if (canEdit && !msg.deleted) {
    items.push({ icon: '✏️', text: 'ویرایش', action: () => {
      const newText = prompt('متن جدید:', getPlainText(msg));
      if (newText === null || !newText.trim()) return;
      encryptText(newText.trim()).then(enc => {
        DB.updateMessage(chatId, msg.id, { text: enc, edited: true });
        broadcast('messages-update', { chatId });
        adminOpenChatReadOnly(chatId);
      });
    }});
  }
  if (canDelete) {
    items.push({ icon: '🗑️', text: 'حذف کامل', delete: true, action: () => {
      DB.hardDeleteMessage(chatId, msg.id);
      broadcast('messages-update', { chatId });
      adminOpenChatReadOnly(chatId);
    }});
  }
  if (items.length === 0) return;
  items.forEach(item => {
    const el = document.createElement('div');
    el.className = 'context-menu-item' + (item.delete ? ' delete' : '');
    el.innerHTML = `<span>${item.icon}</span><span>${item.text}</span>`;
    el.onclick = () => { item.action(); menu.remove(); };
    menu.appendChild(el);
  });
  document.body.appendChild(menu);
  setTimeout(() => document.addEventListener('click', () => menu.remove(), { once: true }), 10);
}

function adminEditUser(u) {
  if (!checkAdminPermission(currentUser, 'editUsers')) { notify('دسترسی نداری'); return; }
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="modal-content">
      <div class="modal-header"><h3>✏️ ویرایش ${escapeHtml(u.name)}</h3><button class="close-btn">✕</button></div>
      <div class="modal-body">
        <label>نام نمایشی</label>
        <input type="text" id="adminEditName" value="${escapeHtml(u.name)}">
        <label>نام کاربری</label>
        <input type="text" id="adminEditUsername" value="${escapeHtml(u.username)}">
        <label>رمز جدید (خالی = بدون تغییر)</label>
        <input type="text" id="adminEditPassword">
        <label>بیوگرافی</label>
        <textarea id="adminEditBio" rows="2">${escapeHtml(u.bio || '')}</textarea>
        <button class="primary-btn" id="adminSaveUser">💾 ذخیره</button>
      </div>
    </div>
  `;
  modal.querySelector('.close-btn').onclick = () => modal.remove();
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
  modal.querySelector('#adminSaveUser').onclick = async () => {
    const name = modal.querySelector('#adminEditName').value.trim();
    const username = modal.querySelector('#adminEditUsername').value.trim().toLowerCase();
    const newPassword = modal.querySelector('#adminEditPassword').value;
    const bio = modal.querySelector('#adminEditBio').value.trim();
    if (!name || !username) { notify('نام و نام کاربری لازمه'); return; }
    if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) { notify('نام کاربری نامعتبر'); return; }
    const other = DB.findUserByUsername(username);
    if (other && other.uid !== u.uid) { notify('نام کاربری تکراریه'); return; }
    const updates = { name, username, bio };
    if (newPassword) {
      if (newPassword.length < 6) { notify('رمز حداقل ۶'); return; }
      updates.password = await hashPassword(newPassword);
    }
    DB.updateUser(u.uid, updates);
    broadcast('users-update');
    modal.remove();
    renderAdminPanel();
    notify('👑 ویرایش شد', true);
  };
  document.body.appendChild(modal);
}

function adminDeleteUser(u) {
  if (!checkAdminPermission(currentUser, 'deleteUsers')) { notify('دسترسی نداری'); return; }
  if (!confirm(`کاربر «${u.name}» حذف شه؟`)) return;
  if (!confirm('آخرین اخطار!')) return;
  const chats = DB.getChats();
  chats.forEach(c => {
    const msgs = DB.getMessages(c.id).filter(m => m.senderId !== u.uid);
    DB.saveMessages(c.id, msgs);
  });
  DB.deleteUser(u.uid);
  broadcast('users-update');
  renderAdminPanel();
  notify('🗑️ حذف شد', true);
}

function adminBroadcast() {
  if (!checkAdminPermission(currentUser, 'broadcast')) { notify('دسترسی نداری'); return; }
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="modal-content">
      <div class="modal-header"><h3>📢 پیام همگانی</h3><button class="close-btn">✕</button></div>
      <div class="modal-body">
        <textarea id="broadcastText" rows="4" placeholder="متن..."></textarea>
        <button class="primary-btn" id="sendBroadcast" style="background:linear-gradient(135deg, #f59e0b, #ef4444);">📢 ارسال</button>
      </div>
    </div>
  `;
  modal.querySelector('.close-btn').onclick = () => modal.remove();
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
  modal.querySelector('#sendBroadcast').onclick = async () => {
    const text = modal.querySelector('#broadcastText').value.trim();
    if (!text) { notify('متن رو بنویس'); return; }
    const users = DB.getUsers().filter(u => u.uid !== ADMIN_USER.uid && !u.isRootAdmin);
    const encrypted = await encryptText(text);
    users.forEach(u => {
      const chat = DB.getOrCreateChat(ADMIN_USER.uid, u.uid);
      const msg = {
        id: genMsgId(), text: encrypted, type: 'text',
        senderId: ADMIN_USER.uid, senderName: '👑 ADMIN',
        timestamp: Date.now(), readBy: [], reactions: {},
        isAdminMessage: true
      };
      DB.addMessage(chat.id, msg);
      DB.updateChat(chat.id, { lastMessage: { ...msg, text: '🔒 پیام' } });
    });
    broadcast('chats-update');
    modal.remove();
    notify(`📢 به ${users.length} کاربر ارسال شد`, true);
  };
  document.body.appendChild(modal);
}

async function adminClearAll() {
  if (!isRootAdmin()) return;
  if (!confirm('کل دیتابیس پاک شه؟')) return;
  if (!confirm('آخرین اخطار!')) return;
  const pwd = prompt('رمز ADMIN:');
  if (!pwd) return;
  try {
    const storedHash = await hashPassword(ADMIN_CREDENTIALS.password);
    const verify = await verifyPassword(pwd, storedHash);
    if (!verify.match) { notify('رمز اشتباه!', true); return; }
    const keys = Object.keys(localStorage);
    keys.forEach(k => {
      if (k.startsWith('chat_') || k === 'savedUsername') localStorage.removeItem(k);
    });
    await ImageDB.clear();
    notify('🗑️ پاک شد', true);
    setTimeout(() => location.reload(), 1500);
  } catch (e) { notify('خطا', true); }
}

function openChat(chat) {
  if (currentChatId && typingUsersByChat[currentChatId]) {
    clearTimeout(typingUsersByChat[currentChatId]);
    delete typingUsersByChat[currentChatId];
  }

  currentChatId = chat.id;
  currentChatUserId = chat.type === 'private'
    ? chat.participants.find(p => p !== currentUser.uid)
    : null;

  document.querySelectorAll('.chat-item').forEach(el => el.classList.toggle('active', el.dataset.chatId === chat.id));
  if (window.innerWidth <= 768) $('sidebar').classList.add('mobile-hidden');

  messageSearchTerm = '';
  replyingTo = null;

  let displayName, initialHtml, status;
  if (chat.type === 'group') {
    displayName = chat.name;
    const imgSrc = getImageSrc(chat.photoURL);
    initialHtml = imgSrc ? `<img src="${imgSrc}">` : '👥';
    status = `${chat.participants.length} عضو`;
  } else {
    const other = DB.getUserById(currentChatUserId);
    displayName = getDisplayName(currentChatUserId);
    const imgSrc = getImageSrc(other?.photoURL);
    initialHtml = imgSrc
      ? `<img src="${imgSrc}"><span class="online-indicator ${isUserOnline(other) ? 'on' : 'off'}"></span>`
      : `${escapeHtml(displayName[0].toUpperCase())}<span class="online-indicator ${isUserOnline(other) ? 'on' : 'off'}"></span>`;
    status = isUserOnline(other) ? 'آنلاین' : 'آخرین بازدید: ' + timeAgo(other?.lastSeen);
  }

  const pinned = chat.pinnedMessages || [];

  $('chatWindow').innerHTML = `
    <div class="chat-header">
      <button class="mobile-back" id="mobileBack">←</button>
      <div class="avatar">${initialHtml}</div>
      <div class="chat-header-info">
        <h3>${escapeHtml(displayName)}</h3>
        <div class="status ${status === 'آنلاین' ? 'online' : ''}" id="chatStatus">${escapeHtml(status)}</div>
      </div>
      ${chat.type === 'private' ? `
        <select class="disappear-select" id="disappearSelect">
          <option value="0">⏱️ خاموش</option>
          <option value="10">⏱️ ۱۰s</option>
          <option value="60">⏱️ ۱m</option>
          <option value="3600">⏱️ ۱h</option>
        </select>
      ` : ''}
      <button class="icon-btn" id="searchMsgBtn" title="جستجو">🔍</button>
      <button class="icon-btn" id="chatInfoBtn">ℹ️</button>
    </div>
    <div id="messageSearchBarWrap"></div>
    ${pinned.length > 0 ? `<div class="pinned-bar" id="pinnedBar">📌 <strong>${pinned.length} پیام پین‌شده</strong></div>` : ''}
    <div class="messages-container" id="messagesContainer">
      <button class="jump-to-latest" id="jumpToLatest">
        ⬇️<span class="badge" id="jumpBadge" style="display:none;">0</span>
      </button>
    </div>
    <div class="message-input-area">
      <button class="icon-btn" id="attachBtn" title="پیوست">📎</button>
      <button class="icon-btn" id="stickerBtn">😊</button>
      <input type="text" id="msgInput" placeholder="پیام..." maxlength="5000">
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
  `;

  const sel = $('disappearSelect');
  if (sel) {
    sel.value = chat.disappearTimer || 0;
    sel.onchange = () => {
      withPermission('disappearMode', (ok) => {
        if (!ok) { sel.value = chat.disappearTimer || 0; return; }
        DB.updateChat(chat.id, { disappearTimer: parseInt(sel.value) });
        broadcast('chats-update');
        notify(sel.value == 0 ? 'خاموش' : 'فعال');
      });
    };
  }

  $('mobileBack').onclick = () => $('sidebar').classList.remove('mobile-hidden');
  $('chatInfoBtn').onclick = () => {
    if (chat.type === 'group') showGroupInfo(chat);
    else showChatInfo(chat);
  };
  $('searchMsgBtn').onclick = () => toggleMessageSearch(chat.id);
  $('attachBtn').onclick = () => showAttachMenu(chat.id);
  $('stickerBtn').onclick = () => withPermission('sendSticker', ok => ok && showStickerPicker());
  $('sendBtn').onclick = () => sendMessage(chat.id);
  $('msgInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(chat.id); });
  $('msgInput').addEventListener('input', handleTyping);
  $('msgInput').focus();

  const pb = $('pinnedBar');
  if (pb && pinned.length > 0) {
    pb.onclick = () => {
      const el = $('messagesContainer').querySelector(`[data-msg-id="${pinned[0]}"]`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('highlighted');
        setTimeout(() => el.classList.remove('highlighted'), 2500);
      }
    };
  }

  const jbtn = $('jumpToLatest');
  if (jbtn) jbtn.onclick = () => {
    const c = $('messagesContainer');
    if (c) c.scrollTop = c.scrollHeight;
    const badge = $('jumpBadge');
    if (badge) { badge.style.display = 'none'; badge.textContent = '0'; }
    updateJumpToLatestBtn();
  };

  const container = $('messagesContainer');
  if (container) container.addEventListener('scroll', updateJumpToLatestBtn);

  markAsRead(chat.id);
  renderMessages(chat.id);
  renderChats();
}

function updateJumpToLatestBtn() {
  const container = $('messagesContainer');
  const btn = $('jumpToLatest');
  if (!container || !btn) return;
  const atBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 100;
  if (atBottom) {
    btn.classList.remove('show');
    const badge = $('jumpBadge');
    if (badge) { badge.style.display = 'none'; badge.textContent = '0'; }
  } else btn.classList.add('show');
}

function toggleMessageSearch(chatId) {
  withPermission('searchMessages', (ok) => {
    if (!ok) return;
    const wrap = $('messageSearchBarWrap');
    if (wrap.querySelector('.message-search-bar')) {
      wrap.innerHTML = '';
      messageSearchTerm = '';
      renderMessages(chatId);
      return;
    }
    wrap.innerHTML = `
      <div class="message-search-bar">
        <input type="text" id="msgSearchInput" placeholder="🔍 جستجو در پیام‌ها...">
        <span class="search-counter" id="searchCounter"></span>
        <button id="msgSearchClose">✕</button>
      </div>
    `;
    const input = $('msgSearchInput');
    input.focus();
    const debouncedSearch = debounce((q) => {
      messageSearchTerm = q;
      renderMessages(chatId, messageSearchTerm);
    }, 250);
    input.addEventListener('input', () => debouncedSearch(input.value.trim()));
    $('msgSearchClose').onclick = () => {
      messageSearchTerm = '';
      wrap.innerHTML = '';
      renderMessages(chatId);
    };
  });
}

function markAsRead(chatId) {
  const chat = DB.getChatById(chatId);
  if (!chat) return;
  const lastReadAt = chat.lastReadAt || {};
  lastReadAt[currentUser.uid] = Date.now();
  DB.updateChat(chatId, { lastReadAt });
  const messages = DB.getMessages(chatId);
  let changed = false;
  messages.forEach(m => {
    if (m.senderId !== currentUser.uid) {
      m.readBy = m.readBy || [];
      if (!m.readBy.includes(currentUser.uid)) { m.readBy.push(currentUser.uid); changed = true; }
    }
  });
  if (changed) DB.saveMessages(chatId, messages);
}

function handleTyping() {
  if (!currentChatId) return;
  const chat = DB.getChatById(currentChatId);
  if (!chat || chat.type === 'group') return;
  const chatIdAtTime = currentChatId;
  const statusEl = $('chatStatus');
  if (statusEl) {
    statusEl.textContent = 'داره می‌نویسه...';
    statusEl.classList.add('typing');
    statusEl.classList.remove('online');
  }
  if (typingUsersByChat[chatIdAtTime]) clearTimeout(typingUsersByChat[chatIdAtTime]);
  typingUsersByChat[chatIdAtTime] = setTimeout(() => {
    delete typingUsersByChat[chatIdAtTime];
    if (currentChatId === chatIdAtTime) {
      const statusEl2 = $('chatStatus');
      const other = DB.getUserById(currentChatUserId);
      if (statusEl2) {
        if (isUserOnline(other)) { statusEl2.textContent = 'آنلاین'; statusEl2.classList.add('online'); }
        else statusEl2.textContent = 'آخرین بازدید: ' + timeAgo(other?.lastSeen);
        statusEl2.classList.remove('typing');
      }
    }
  }, 1500);
}

async function renderMessages(chatId, searchQuery = '') {
  const messages = DB.getMessages(chatId);
  const container = $('messagesContainer');
  if (!container) return;

  const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 150;
  const oldScrollTop = container.scrollTop;

  messages.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
  const now = Date.now();
  let filtered = messages.filter(m => {
    if (m.disappearAt && m.disappearAt < now) return false;
    if ((m.deletedFor || []).includes(currentUser.uid)) return false;
    return true;
  });

  await ensureDecrypted(filtered);

  let highlightIds = [];
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(m => {
      if (m.deleted) return false;
      return getPlainText(m).toLowerCase().includes(q);
    });
    highlightIds = filtered.map(m => m.id);
  }

  const jumpBtn = $('jumpToLatest');
  container.innerHTML = '';
  if (jumpBtn) container.appendChild(jumpBtn);

  if (searchQuery && filtered.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'پیامی پیدا نشد';
    container.appendChild(empty);
    const counter = $('searchCounter');
    if (counter) counter.textContent = '0';
    return;
  }

  const counter = $('searchCounter');
  if (counter && searchQuery) counter.textContent = filtered.length + ' نتیجه';

  let lastDate = null;
  filtered.forEach(msg => {
    const msgDate = new Date(msg.timestamp).toDateString();
    if (lastDate !== msgDate) {
      const div = document.createElement('div');
      div.className = 'date-divider';
      div.dataset.date = msgDate;
      div.textContent = formatDateDivider(msg.timestamp);
      container.appendChild(div);
      lastDate = msgDate;
    }
    const el = createMessageElement(msg, chatId);
    if (highlightIds.includes(msg.id)) el.classList.add('highlighted');
    container.appendChild(el);
  });

  if (wasAtBottom) container.scrollTop = container.scrollHeight;
  else if (searchQuery) {
    const firstHighlight = container.querySelector('.highlighted');
    if (firstHighlight) firstHighlight.scrollIntoView({ block: 'center' });
    else container.scrollTop = oldScrollTop;
  } else container.scrollTop = oldScrollTop;

  markSeen(chatId);
  updateJumpToLatestBtn();
}

function createMessageElement(msg, chatId) {
  const chat = DB.getChatById(chatId);
  const messages = DB.getMessages(chatId);
  const isMine = msg.senderId === currentUser.uid;
  const wrapper = document.createElement('div');
  wrapper.className = 'message-wrapper ' + (isMine ? 'sent' : 'received');
  wrapper.dataset.msgId = msg.id;
  wrapper.dataset.hash = JSON.stringify({
    text: msg.text, deleted: msg.deleted, edited: msg.edited,
    reactions: msg.reactions, disappearAt: msg.disappearAt, type: msg.type,
    poll: msg.poll
  });

  const isSticker = msg.type === 'sticker';
  const readTicks = isMine ? (msg.readBy && msg.readBy.length > 0 ? '✓✓' : '✓') : '';
  const adminMsg = isFromAdmin(msg);

  if (msg.deleted) {
    const deletedStyle = adminMsg ? 'background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff;' : '';
    wrapper.innerHTML = `
      <div class="message deleted-msg" style="${deletedStyle}">
        <span style="font-style:italic;opacity:0.7;">🗑️ پیام حذف شد</span>
        <span class="time">${formatTime(msg.timestamp)}</span>
      </div>
    `;
    return wrapper;
  }

  const plainText = getPlainText(msg);

  let senderNameHtml = '';
  if (adminMsg && !isMine) senderNameHtml = `<div class="sender-name" style="color:#f59e0b;font-weight:bold;">👑 ADMIN</div>`;
  else if (!isMine && chat.type === 'group') senderNameHtml = `<div class="sender-name">${escapeHtml(getDisplayName(msg.senderId))}</div>`;
  else if (adminMsg && isMine) senderNameHtml = `<div class="sender-name" style="color:#fff;font-weight:bold;">👑 ADMIN (تو)</div>`;

  const forwardedHtml = msg.forwarded ? `<div class="forwarded-label" style="${adminMsg ? 'color:#fff;' : ''}">↪️ فوروارد شده</div>` : '';

  let replyHtml = '';
  if (msg.replyTo) {
    const replyMsg = messages.find(m => m.id === msg.replyTo);
    if (replyMsg) {
      const replyName = replyMsg.senderId === currentUser.uid ? 'شما'
        : (isFromAdmin(replyMsg) ? '👑 ADMIN' : getDisplayName(replyMsg.senderId));
      let replyText = replyMsg.deleted ? '🗑️ حذف شده' : getPlainText(replyMsg).slice(0, 50);
      replyHtml = `<div class="reply-box">↩️ <b>${escapeHtml(replyName)}</b>: ${escapeHtml(replyText)}</div>`;
    }
  }

  let mediaHtml = '';
  if (msg.type === 'media' && msg.mediaRef) {
    const imgSrc = getImageSrc(msg.mediaRef);
    mediaHtml = `<img src="${imgSrc}" class="msg-media" data-img="${imgSrc}">`;
  } else if (msg.type === 'voice' && msg.audioRef) {
    const audioSrc = getImageSrc(msg.audioRef);
    const bars = Array.from({length: 25}, () => Math.random() * 20 + 4);
    mediaHtml = `
      <div class="msg-voice">
        <button class="voice-play-btn" data-audio="${audioSrc}">▶️</button>
        <div class="voice-waveform">
          ${bars.map(h => `<div class="wave-bar" style="height:${h}px"></div>`).join('')}
        </div>
        <span class="voice-duration">${msg.duration || 0}s</span>
      </div>
    `;
  } else if (msg.type === 'location') {
    mediaHtml = `
      <div class="msg-location">
        <span class="loc-icon">📍</span>
        <div>
          <div style="font-weight:bold;">موقعیت مکانی</div>
          <div style="font-size:11px;color:var(--text-muted);">${msg.lat?.toFixed(4)}, ${msg.lng?.toFixed(4)}</div>
        </div>
      </div>
    `;
  } else if (msg.type === 'poll') {
    const poll = msg.poll;
    const totalVotes = Object.values(poll.votes || {}).reduce((sum, arr) => sum + (arr?.length || 0), 0);
    const myVote = Object.entries(poll.votes || {}).find(([k, arr]) => arr.includes(currentUser.uid))?.[0];
    const isQuiz = poll.isQuiz && typeof poll.correctIndex === 'number';
    const canSeeAnswer = isQuiz && (myVote !== undefined || isMine);

    mediaHtml = `
      <div class="msg-poll">
        <div class="poll-question">${isQuiz ? '📝 آزمون' : '📊 نظرسنجی'}: ${escapeHtml(poll.question)}</div>
        ${poll.options.map((opt, idx) => {
          const votes = (poll.votes && poll.votes[idx]) ? poll.votes[idx].length : 0;
          const percent = totalVotes > 0 ? Math.round((votes / totalVotes) * 100) : 0;
          const voted = myVote === String(idx);
          let extraClass = '';
          let iconHtml = '';
          if (isQuiz && canSeeAnswer) {
            if (idx === poll.correctIndex) { extraClass = 'correct'; iconHtml = ' ✅'; }
            else if (voted) { extraClass = 'wrong'; iconHtml = ' ❌'; }
          }
          return `
            <div class="poll-option ${voted ? 'voted' : ''} ${extraClass}" data-poll="${msg.id}" data-idx="${idx}">
              <div class="poll-bar" style="width:${isQuiz && !canSeeAnswer ? 0 : percent}%"></div>
              <div class="poll-text">
                <span>${escapeHtml(opt)}${iconHtml}</span>
                <span class="poll-percent">${isQuiz && !canSeeAnswer ? '?' : `${percent}% (${votes})`}</span>
              </div>
            </div>
          `;
        }).join('')}
        <div style="font-size:11px;color:var(--text-muted);margin-top:8px;">${totalVotes} رای${isQuiz ? ' • آزمون' : ''}${isQuiz && !canSeeAnswer ? ' • برای دیدن جواب، رای بده' : ''}</div>
      </div>
    `;
  }

  let reactionsHtml = '';
  if (msg.reactions && Object.keys(msg.reactions).length > 0) {
    const valid = Object.entries(msg.reactions).filter(([k, v]) => v && v.length > 0);
    if (valid.length > 0) {
      reactionsHtml = '<div class="reactions">';
      for (const [emoji, users] of valid) {
        const isMineReact = users.includes(currentUser.uid);
        reactionsHtml += `<span class="reaction ${isMineReact ? 'mine' : ''}" data-msg="${msg.id}" data-emoji="${escapeHtml(emoji)}">${escapeHtml(emoji)} ${users.length}</span>`;
      }
      reactionsHtml += '</div>';
    }
  }

  const editedTag = msg.edited ? ' edited' : '';
  const disappearBadge = msg.disappearAt ? `<span class="disappear-badge">⏱️</span>` : '';
  const adminStyle = adminMsg ? 'background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff;' : '';

  const bodyContent = isSticker
    ? `<div class="message sticker-msg">${escapeHtml(plainText)}</div>`
    : `<div class="message${editedTag}" style="${adminStyle}">
         ${senderNameHtml}${forwardedHtml}${replyHtml}
         ${mediaHtml}
         ${plainText ? renderMarkdown(plainText) : ''}
         <span class="time">
           ${disappearBadge}<span class="ticks">${readTicks}</span>${formatTime(msg.timestamp)}
         </span>
       </div>`;

  wrapper.innerHTML = bodyContent + reactionsHtml;

  if (!isSticker) {
    wrapper.querySelector('.message').addEventListener('contextmenu', (e) => {
      e.preventDefault();
      showContextMenu(e.clientX, e.clientY, msg, chatId);
    });
    wrapper.querySelector('.message').addEventListener('dblclick', (e) => {
      e.preventDefault();
      withPermission('sendReaction', (ok) => { if (ok) showReactionPicker(e.clientX, e.clientY, msg, chatId); });
    });
  }

  wrapper.querySelectorAll('.reaction').forEach(el => {
    el.addEventListener('click', () => toggleReaction(chatId, el.dataset.msg, el.dataset.emoji));
  });

  wrapper.querySelectorAll('.msg-media').forEach(img => {
    img.addEventListener('click', (e) => {
      e.stopPropagation();
      openLightbox(img.dataset.img || img.src);
    });
  });

  wrapper.querySelectorAll('.voice-play-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      playVoice(btn.dataset.audio, btn);
    });
  });

  wrapper.querySelectorAll('.poll-option').forEach(opt => {
    opt.addEventListener('click', (e) => {
      e.stopPropagation();
      votePoll(chatId, opt.dataset.poll, opt.dataset.idx);
    });
  });

  return wrapper;
}

function playVoice(src, btn) {
  const audio = new Audio(src);
  btn.textContent = '⏸️';
  audio.play();
  audio.onended = () => { btn.textContent = '▶️'; };
  btn.onclick = (e) => {
    e.stopPropagation();
    if (audio.paused) { audio.play(); btn.textContent = '⏸️'; }
    else { audio.pause(); btn.textContent = '▶️'; }
  };
}

function openLightbox(src) {
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<button class="close-lb">✕</button><img src="${src}" alt="">`;
  document.body.appendChild(lb);
  lb.querySelector('.close-lb').onclick = () => lb.remove();
  lb.onclick = (e) => { if (e.target === lb) lb.remove(); };
}

function votePoll(chatId, msgId, optionIdx) {
  const messages = DB.getMessages(chatId);
  const msg = messages.find(m => m.id === msgId);
  if (!msg || msg.type !== 'poll') return;
  const poll = msg.poll;
  poll.votes = poll.votes || {};

  if (poll.isQuiz) {
    const alreadyVoted = Object.values(poll.votes).some(arr => arr && arr.includes(currentUser.uid));
    if (alreadyVoted) { notify('قبلاً جواب دادی!'); return; }
  }

  if (!poll.isQuiz) {
    Object.keys(poll.votes).forEach(k => {
      poll.votes[k] = (poll.votes[k] || []).filter(u => u !== currentUser.uid);
    });
  }

  poll.votes[optionIdx] = poll.votes[optionIdx] || [];
  if (!poll.votes[optionIdx].includes(currentUser.uid)) {
    poll.votes[optionIdx].push(currentUser.uid);
  }

  if (poll.isQuiz) {
    if (parseInt(optionIdx) === poll.correctIndex) {
      notify('✅ درست!', true);
      playNotifSound();
    } else {
      notify('❌ اشتباه!');
    }
  }

  DB.saveMessages(chatId, messages);
  broadcast('messages-update', { chatId });
  const el = document.querySelector(`[data-msg-id="${msgId}"]`);
  if (el) {
    const newEl = createMessageElement(msg, chatId);
    el.replaceWith(newEl);
  }
}

function markSeen(chatId) {
  const messages = DB.getMessages(chatId);
  let changed = false;
  const chat = DB.getChatById(chatId);
  const now = Date.now();
  messages.forEach(m => {
    if (m.senderId !== currentUser.uid) {
      m.seenBy = m.seenBy || [];
      if (!m.seenBy.includes(currentUser.uid)) {
        m.seenBy.push(currentUser.uid);
        if (chat.disappearTimer && chat.disappearTimer > 0 && !m.disappearAt) {
          m.disappearAt = now + (chat.disappearTimer * 1000);
        }
        changed = true;
      }
    }
  });
  if (changed) DB.saveMessages(chatId, messages);
}

function pickMediaFile(chatId) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 3 * 1024 * 1024) { notify('حجم زیر ۳ مگ'); return; }
    const reader = new FileReader();
    reader.onload = async (e) => {
      const ref = await saveImage(e.target.result);
      const chat = DB.getChatById(chatId);
      const disappearTimer = chat?.disappearTimer || 0;
      const message = {
        id: genMsgId(), text: '', type: 'media', mediaRef: ref,
        senderId: currentUser.uid, senderName: currentUser.name,
        timestamp: Date.now(), readBy: [], reactions: {},
        isAdminMessage: isRootAdmin(),
        disappearAt: disappearTimer > 0 ? Date.now() + disappearTimer * 1000 : null
      };
      DB.addMessage(chatId, message);
      DB.updateChat(chatId, { lastMessage: { ...message, text: '🖼️ عکس' } });
      broadcast('messages-update', { chatId });
      renderMessages(chatId);
      renderChats();
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

async function startVoiceRecording(chatId) {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.start();

    recordingStartTime = Date.now();
    const overlay = document.createElement('div');
    overlay.className = 'recording-bar';
    overlay.innerHTML = `
      <div class="recording-indicator">🎤</div>
      <div class="recording-timer" id="recTimer">00:00</div>
      <div class="recording-actions">
        <button class="rec-btn cancel" id="recCancel">✕</button>
        <button class="rec-btn send" id="recSend">✓</button>
      </div>
    `;
    document.body.appendChild(overlay);

    recordingTimerInterval = setInterval(() => {
      const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
      const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const s = String(elapsed % 60).padStart(2, '0');
      const el = $('recTimer');
      if (el) el.textContent = `${m}:${s}`;
      if (elapsed >= 60) stopVoiceRecording(chatId, true);
    }, 1000);

    $('recCancel').onclick = () => stopVoiceRecording(chatId, false);
    $('recSend').onclick = () => stopVoiceRecording(chatId, true);
  } catch (e) {
    notify('دسترسی به میکروفون رد شد');
  }
}

function stopVoiceRecording(chatId, send) {
  if (recordingTimerInterval) clearInterval(recordingTimerInterval);
  const overlay = document.querySelector('.recording-bar');
  if (overlay) overlay.remove();

  if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
  const duration = Math.round((Date.now() - recordingStartTime) / 1000);
  const chunks = [...recordedChunks];

  mediaRecorder.onstop = async () => {
    if (!send || chunks.length === 0 || duration < 1) {
      mediaRecorder.stream.getTracks().forEach(t => t.stop());
      mediaRecorder = null;
      return;
    }
    const blob = new Blob(chunks, { type: 'audio/webm' });
    const reader = new FileReader();
    reader.onload = async (e) => {
      const ref = await saveImage(e.target.result);
      const chat = DB.getChatById(chatId);
      const disappearTimer = chat?.disappearTimer || 0;
      const message = {
        id: genMsgId(), text: '', type: 'voice', audioRef: ref, duration,
        senderId: currentUser.uid, senderName: currentUser.name,
        timestamp: Date.now(), readBy: [], reactions: {},
        isAdminMessage: isRootAdmin(),
        disappearAt: disappearTimer > 0 ? Date.now() + disappearTimer * 1000 : null
      };
      DB.addMessage(chatId, message);
      DB.updateChat(chatId, { lastMessage: { ...message, text: '🎤 پیام صوتی' } });
      broadcast('messages-update', { chatId });
      renderMessages(chatId);
      renderChats();
    };
    reader.readAsDataURL(blob);
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
    mediaRecorder = null;
  };
  mediaRecorder.stop();
}

function sendLocation(chatId) {
  if (!navigator.geolocation) { notify('مرورگر پشتیبانی نمی‌کنه'); return; }
  notify('در حال دریافت موقعیت...');
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const { latitude, longitude } = pos.coords;
    const chat = DB.getChatById(chatId);
    const disappearTimer = chat?.disappearTimer || 0;
    const message = {
      id: genMsgId(), text: `📍 موقعیت: ${latitude.toFixed(4)}, ${longitude.toFixed(4)}`,
      type: 'location', lat: latitude, lng: longitude,
      senderId: currentUser.uid, senderName: currentUser.name,
      timestamp: Date.now(), readBy: [], reactions: {},
      isAdminMessage: isRootAdmin(),
      disappearAt: disappearTimer > 0 ? Date.now() + disappearTimer * 1000 : null
    };
    DB.addMessage(chatId, message);
    DB.updateChat(chatId, { lastMessage: { ...message, text: '📍 موقعیت' } });
    broadcast('messages-update', { chatId });
    renderMessages(chatId);
    renderChats();
  }, () => notify('دریافت موقعیت ناموفق'));
}

// ✅ Poll/Quiz Modal با تب‌ها
function showCreatePollModal(chatId, initialMode = 'poll') {
  let currentMode = initialMode;
  let correctIndex = null;
  let optionCount = 0;

  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="pollModalTitle">${initialMode === 'quiz' ? '📝 ساخت آزمون' : '📊 ساخت نظرسنجی'}</h3>
        <button class="close-btn">✕</button>
      </div>
      <div style="padding: 0 20px; padding-top: 15px;">
        <div class="auth-tabs" style="margin-bottom: 15px;">
          <div class="auth-tab ${initialMode === 'poll' ? 'active' : ''}" data-mode="poll" style="padding: 10px; font-size: 13px;">
            📊 نظرسنجی
          </div>
          <div class="auth-tab ${initialMode === 'quiz' ? 'active' : ''}" data-mode="quiz" style="padding: 10px; font-size: 13px;">
            📝 آزمون
          </div>
        </div>
      </div>
      <div class="modal-body" style="padding-top: 0;">
        <div id="quizHint" style="display: ${initialMode === 'quiz' ? 'block' : 'none'}; padding: 10px; background: linear-gradient(135deg, #fef3c7, #fed7aa); color: #78350f; border-radius: 10px; font-size: 12px; margin-bottom: 12px;">
          💡 برای آزمون، روی دکمه <b>⭕</b> کنار گزینه درست کلیک کن تا <b>✅</b> بشه
        </div>
        <label>سوال</label>
        <input type="text" id="pollQuestion" placeholder="سوال..." maxlength="100">
        <label id="pollOptionsLabel">گزینه‌ها</label>
        <div id="pollOptionsList"></div>
        <button class="text-btn" id="addPollOption" style="margin-bottom: 10px;">➕ افزودن گزینه</button>
        <button class="primary-btn" id="createPoll">ایجاد</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  modal.querySelector('.close-btn').onclick = () => modal.remove();
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });

  function addOptionDiv(placeholder) {
    const idx = optionCount;
    optionCount++;
    const div = document.createElement('div');
    div.style.cssText = 'display:flex;gap:6px;margin-bottom:6px;align-items:center;';
    div.innerHTML = `
      <button type="button" class="correct-toggle" data-idx="${idx}" style="width:36px;height:36px;border:2px solid var(--border);border-radius:8px;background:var(--bg-2);cursor:pointer;font-size:14px;">⭕</button>
      <input type="text" class="pollOptionInput" placeholder="${placeholder}" maxlength="50" style="flex:1;margin:0;">
    `;
    modal.querySelector('#pollOptionsList').appendChild(div);
    bindCorrectToggles();
  }

  function bindCorrectToggles() {
    modal.querySelectorAll('.correct-toggle').forEach(btn => {
      btn.onclick = (e) => {
        e.preventDefault();
        if (currentMode !== 'quiz') {
          notify('اول تب «آزمون» رو بزن');
          return;
        }
        correctIndex = parseInt(btn.dataset.idx);
        modal.querySelectorAll('.correct-toggle').forEach(b => {
          b.textContent = '⭕';
          b.style.background = 'var(--bg-2)';
        });
        btn.textContent = '✅';
        btn.style.background = 'rgba(74,222,128,0.3)';
      };
    });
  }

  addOptionDiv('گزینه ۱');
  addOptionDiv('گزینه ۲');

  modal.querySelectorAll('[data-mode]').forEach(tab => {
    tab.onclick = () => {
      modal.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
      tab.classList.add('active');
      currentMode = tab.dataset.mode;
      const titleEl = modal.querySelector('#pollModalTitle');
      const hintEl = modal.querySelector('#quizHint');
      const labelEl = modal.querySelector('#pollOptionsLabel');
      if (currentMode === 'quiz') {
        titleEl.textContent = '📝 ساخت آزمون';
        hintEl.style.display = 'block';
        labelEl.textContent = 'گزینه‌ها (روی ✅ کلیک کن تا جواب درست رو مشخص کنی)';
      } else {
        titleEl.textContent = '📊 ساخت نظرسنجی';
        hintEl.style.display = 'none';
        labelEl.textContent = 'گزینه‌ها';
        correctIndex = null;
        modal.querySelectorAll('.correct-toggle').forEach(b => {
          b.textContent = '⭕';
          b.style.background = 'var(--bg-2)';
        });
      }
    };
  });

  modal.querySelector('#addPollOption').onclick = () => {
    if (optionCount >= 6) { notify('حداکثر ۶ گزینه'); return; }
    addOptionDiv(`گزینه ${optionCount + 1}`);
  };

  modal.querySelector('#createPoll').onclick = () => {
    const question = modal.querySelector('#pollQuestion').value.trim();
    const options = Array.from(modal.querySelectorAll('.pollOptionInput'))
      .map(i => i.value.trim()).filter(Boolean);
    if (!question) { notify('سوال رو بنویس'); return; }
    if (options.length < 2) { notify('حداقل ۲ گزینه'); return; }
    if (currentMode === 'quiz' && correctIndex === null) {
      notify('برای آزمون، جواب درست رو مشخص کن'); return;
    }

    const chat = DB.getChatById(chatId);
    const disappearTimer = chat?.disappearTimer || 0;
    const pollData = { question, options, votes: {} };
    if (currentMode === 'quiz') {
      pollData.isQuiz = true;
      pollData.correctIndex = correctIndex;
    }

    const message = {
      id: genMsgId(),
      text: currentMode === 'quiz' ? `📝 آزمون: ${question}` : `📊 نظرسنجی: ${question}`,
      type: 'poll',
      poll: pollData,
      senderId: currentUser.uid, senderName: currentUser.name,
      timestamp: Date.now(), readBy: [], reactions: {},
      isAdminMessage: isRootAdmin(),
      disappearAt: disappearTimer > 0 ? Date.now() + disappearTimer * 1000 : null
    };
    DB.addMessage(chatId, message);
    DB.updateChat(chatId, { lastMessage: { ...message, text: currentMode === 'quiz' ? '📝 آزمون' : '📊 نظرسنجی' } });
    broadcast('messages-update', { chatId });
    modal.remove();
    renderMessages(chatId);
    renderChats();
  };
}

async function sendMessage(chatId) {
  const input = $('msgInput');
  const text = input.value.trim();
  if (!text) return;
  if (text.length > 5000) { notify('پیام طولانیه'); return; }

  withPermission('sendMessage', async (ok) => {
    if (!ok) return;
    input.value = '';

    const chat = DB.getChatById(chatId);
    if (chat && chat.type === 'private') {
      const otherId = chat.participants.find(p => p !== currentUser.uid);
      const other = DB.getUserById(otherId);
      if (other && !other.isRootAdmin && DB.isBlocked(otherId, currentUser.uid)) {
        notify('🚫 مسدود شده‌اید'); return;
      }
      if (other && DB.isBlocked(currentUser.uid, otherId)) {
        notify('🚫 رفع مسدودی کن'); return;
      }
    }

    const isRealAdmin = isRootAdmin();
    const disappearTimer = chat?.disappearTimer || 0;
    const encrypted = await encryptText(text);

    const message = {
      id: genMsgId(), text: encrypted, type: 'text',
      senderId: currentUser.uid, senderName: currentUser.name,
      timestamp: Date.now(), readBy: [], reactions: {},
      replyTo: replyingTo, isAdminMessage: isRealAdmin,
      disappearAt: disappearTimer > 0 ? Date.now() + disappearTimer * 1000 : null
    };
    replyingTo = null;
    $('msgInput').placeholder = 'پیام...';

    if (currentChatId === chatId) {
      const container = $('messagesContainer');
      if (container) {
        const pendingEl = document.createElement('div');
        pendingEl.className = 'message-wrapper sent pending';
        pendingEl.dataset.pendingId = message.id;
        pendingEl.innerHTML = `<div class="message">${escapeHtml(text)}<span class="time">در حال ارسال...</span></div>`;
        container.appendChild(pendingEl);
        container.scrollTop = container.scrollHeight;
      }
    }

    const undoBar = document.createElement('div');
    undoBar.className = 'undo-send-bar';
    undoBar.dataset.msgId = message.id;
    undoBar.innerHTML = `
      <span>📤 ارسال شد</span>
      <button class="undo-btn">↩️ لغو</button>
      <div class="progress"></div>
    `;
    document.body.appendChild(undoBar);

    const timeout = setTimeout(() => {
      commitSendMessage(message.id, text);
    }, 5000);

    undoBar.querySelector('.undo-btn').onclick = () => {
      clearTimeout(timeout);
      undoBar.remove();
      const pendingEl = document.querySelector(`[data-pending-id="${message.id}"]`);
      if (pendingEl) pendingEl.remove();
      pendingMessages.delete(message.id);
      notify('↩️ لغو شد');
    };

    pendingMessages.set(message.id, { chatId, message, timeout, undoBar, plainText: text });
  });
}

async function commitSendMessage(msgId, plainText) {
  const pending = pendingMessages.get(msgId);
  if (!pending) return;
  const { chatId, message, undoBar } = pending;

  const chat = DB.getChatById(chatId);
  if (chat && chat.type === 'private') {
    const otherId = chat.participants.find(p => p !== currentUser.uid);
    if (DB.isBlocked(otherId, currentUser.uid)) {
      pendingMessages.delete(msgId);
      if (undoBar) undoBar.remove();
      const pendingEl = document.querySelector(`[data-pending-id="${msgId}"]`);
      if (pendingEl) pendingEl.remove();
      return;
    }
  }

  DB.addMessage(chatId, message);
  DB.updateChat(chatId, { lastMessage: { ...message, text: '🔒 پیام' } });
  broadcast('messages-update', { chatId });

  if (messageSearchTerm && currentChatId === chatId) {
    messageSearchTerm = '';
    const wrap = $('messageSearchBarWrap');
    if (wrap) wrap.innerHTML = '';
  }

  if (currentChatId === chatId) {
    const container = $('messagesContainer');
    if (container) {
      const pendingEl = container.querySelector(`[data-pending-id="${msgId}"]`);
      if (pendingEl) pendingEl.remove();
      const lastDiv = container.querySelectorAll('.date-divider');
      const lastDate = lastDiv.length > 0 ? lastDiv[lastDiv.length - 1].dataset.date : null;
      const msgDate = new Date(message.timestamp).toDateString();
      if (lastDate !== msgDate) {
        const div = document.createElement('div');
        div.className = 'date-divider';
        div.dataset.date = msgDate;
        div.textContent = formatDateDivider(message.timestamp);
        container.appendChild(div);
      }
      const el = createMessageElement(message, chatId);
      container.appendChild(el);
      container.scrollTop = container.scrollHeight;
    }
  }
  renderChats();
  playNotifSound();
  pendingMessages.delete(msgId);
  if (undoBar) undoBar.remove();
}

function showReactionPicker(x, y, msg, chatId) {
  closeAllPopups();
  if (msg.disappearAt && msg.disappearAt < Date.now()) { notify('منقضی شده'); return; }
  if (msg.deleted) return;
  const picker = document.createElement('div');
  picker.className = 'reaction-picker';
  picker.style.left = Math.min(x, window.innerWidth - 300) + 'px';
  picker.style.top = Math.max(y - 60, 10) + 'px';
  ['👍','❤️','😂','😮','😢','🔥','🎉','👏'].forEach(emoji => {
    const btn = document.createElement('button');
    btn.textContent = emoji;
    btn.onclick = () => { toggleReaction(chatId, msg.id, emoji); picker.remove(); };
    picker.appendChild(btn);
  });
  document.body.appendChild(picker);
  setTimeout(() => document.addEventListener('click', closeAllPopups, { once: true }), 10);
}

function toggleReaction(chatId, msgId, emoji) {
  const messages = DB.getMessages(chatId);
  const msg = messages.find(m => m.id === msgId);
  if (!msg || msg.deleted) return;
  msg.reactions = msg.reactions || {};
  msg.reactions[emoji] = msg.reactions[emoji] || [];
  if (msg.reactions[emoji].includes(currentUser.uid)) {
    msg.reactions[emoji] = msg.reactions[emoji].filter(u => u !== currentUser.uid);
  } else {
    msg.reactions[emoji].push(currentUser.uid);
  }
  Object.keys(msg.reactions).forEach(k => {
    if (!msg.reactions[k] || msg.reactions[k].length === 0) delete msg.reactions[k];
  });
  DB.saveMessages(chatId, messages);
  broadcast('messages-update', { chatId });
  const el = document.querySelector(`[data-msg-id="${msgId}"]`);
  if (el) {
    const newEl = createMessageElement(msg, chatId);
    el.replaceWith(newEl);
  }
}

// ============================================================
function showContextMenu(x, y, msg, chatId) {
  closeAllPopups();
  const isMine = msg.senderId === currentUser.uid;
  const chat = DB.getChatById(chatId);
  const amIAdminInGroup = chat.type === 'group' && isAdmin(chat);
  const amIRoot = isRootAdmin();
  const amIFull = isFullAdmin(currentUser);
  const canAdminEdit = checkAdminPermission(currentUser, 'editAnyMessage');
  const canAdminDelete = checkAdminPermission(currentUser, 'deleteAnyMessage');
  const menu = document.createElement('div');
  menu.className = 'context-menu';
  menu.style.left = Math.min(x, window.innerWidth - 240) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - 320) + 'px';

  const items = [
    { icon: '↩️', text: 'پاسخ', action: () => {
      replyingTo = msg.id;
      $('msgInput').placeholder = 'پاسخ...';
      $('msgInput').focus();
    }},
    { icon: '📌', text: 'پین/آنپین', perm: 'pinMessage', action: () => pinMessage(chatId, msg.id) },
    { icon: '📤', text: 'فوروارد', perm: 'forwardMessage', action: () => forwardMessage(msg) },
    { icon: '😊', text: 'افزودن ری‌اکشن', perm: 'sendReaction', action: () => showReactionPicker(x, y, msg, chatId) }
  ];

  if (!msg.deleted && (isMine || amIRoot || amIFull || canAdminEdit)) {
    items.push({ icon: '✏️', text: 'ویرایش', perm: 'editMessage', action: () => editMessage(chatId, msg.id) });
  }
  items.push({ type: 'divider' });
  items.push({ icon: '🗑️', text: 'حذف برای من', perm: 'deleteMessage', action: () => {
    DB.deleteMessage(chatId, msg.id, false);
    broadcast('messages-update', { chatId });
    renderMessages(chatId);
  }});

  if (isMine || amIAdminInGroup || amIRoot || amIFull || canAdminDelete) {
    items.push({ icon: '🗑️', text: 'حذف برای همه', perm: 'deleteMessage', delete: true, action: () => {
      DB.deleteMessage(chatId, msg.id, true);
      broadcast('messages-update', { chatId });
      renderMessages(chatId);
      renderChats();
    }});
  }
  if (amIRoot || amIFull || canAdminDelete) {
    items.push({ type: 'divider' });
    items.push({ icon: '💀', text: 'حذف کامل', delete: true, action: () => {
      DB.hardDeleteMessage(chatId, msg.id);
      broadcast('messages-update', { chatId });
      renderMessages(chatId);
      renderChats();
    }});
  }

  items.forEach(item => {
    if (item.type === 'divider') {
      const d = document.createElement('div');
      d.className = 'context-menu-divider';
      menu.appendChild(d);
      return;
    }
    const el = document.createElement('div');
    el.className = 'context-menu-item' + (item.delete ? ' delete' : '');
    el.innerHTML = `<span>${item.icon}</span><span>${item.text}</span>`;
    el.onclick = () => {
      menu.remove();
      if (item.perm) withPermission(item.perm, (ok) => { if (ok) item.action(); });
      else item.action();
    };
    menu.appendChild(el);
  });
  document.body.appendChild(menu);
  setTimeout(() => document.addEventListener('click', closeAllPopups, { once: true }), 10);
}

function closeAllPopups() {
  document.querySelectorAll('.context-menu, .reaction-picker, .sticker-picker, .attach-menu').forEach(el => el.remove());
}

function pinMessage(chatId, msgId) {
  const chat = DB.getChatById(chatId);
  chat.pinnedMessages = chat.pinnedMessages || [];
  if (!chat.pinnedMessages.includes(msgId)) {
    chat.pinnedMessages.push(msgId);
    notify('📌 پین شد');
  } else {
    chat.pinnedMessages = chat.pinnedMessages.filter(id => id !== msgId);
    notify('آنپین شد');
  }
  DB.updateChat(chatId, { pinnedMessages: chat.pinnedMessages });
  broadcast('chats-update');
  openChat(DB.getChatById(chatId));
}

async function editMessage(chatId, msgId) {
  const messages = DB.getMessages(chatId);
  const msg = messages.find(m => m.id === msgId);
  if (!msg || msg.deleted) return;
  const plain = getPlainText(msg);
  const newText = prompt('متن جدید:', plain);
  if (newText === null || newText.trim() === '') return;
  if (newText.length > 5000) { notify('متن طولانیه'); return; }
  const encrypted = await encryptText(newText.trim());
  DB.updateMessage(chatId, msgId, { text: encrypted, edited: true });
  broadcast('messages-update', { chatId });
  const el = document.querySelector(`[data-msg-id="${msgId}"]`);
  if (el) {
    const updated = DB.getMessages(chatId).find(m => m.id === msgId);
    const newEl = createMessageElement(updated, chatId);
    el.replaceWith(newEl);
  } else renderMessages(chatId);
  notify('✏️ ویرایش شد');
}

function forwardMessage(msg) {
  const chats = DB.getChats().filter(c => c.participants.includes(currentUser.uid));
  if (chats.length === 0) { notify('چتی نیست'); return; }
  const menu = document.createElement('div');
  menu.className = 'context-menu';
  menu.style.top = '50%'; menu.style.left = '50%';
  menu.style.transform = 'translate(-50%, -50%)';
  menu.style.maxHeight = '400px'; menu.style.overflowY = 'auto';
  menu.innerHTML = `<div style="padding:10px 18px;font-weight:bold;font-size:13px;">📤 فوروارد به:</div>`;

  chats.forEach(c => {
    let name;
    if (c.type === 'group') name = '👥 ' + c.name;
    else name = getDisplayName(c.participants.find(p => p !== currentUser.uid));
    const el = document.createElement('div');
    el.className = 'context-menu-item';
    el.textContent = name;
    el.onclick = () => {
      const fwdMsg = {
        id: genMsgId(), text: msg.text, type: msg.type,
        mediaRef: msg.mediaRef, audioRef: msg.audioRef, duration: msg.duration,
        lat: msg.lat, lng: msg.lng, poll: msg.poll,
        senderId: currentUser.uid, senderName: currentUser.name,
        timestamp: Date.now(), readBy: [], reactions: {},
        forwarded: true, isAdminMessage: isRootAdmin()
      };
      DB.addMessage(c.id, fwdMsg);
      DB.updateChat(c.id, { lastMessage: { ...fwdMsg, text: '↪️ فوروارد' } });
      broadcast('messages-update', { chatId: c.id });
      renderChats();
      notify('فوروارد شد');
      menu.remove();
    };
    menu.appendChild(el);
  });
  document.body.appendChild(menu);
  setTimeout(() => document.addEventListener('click', closeAllPopups, { once: true }), 10);
}

function showStickerPicker() {
  closeAllPopups();
  const picker = document.createElement('div');
  picker.className = 'sticker-picker';
  STICKERS.forEach(sticker => {
    const btn = document.createElement('button');
    btn.textContent = sticker;
    btn.onclick = () => {
      const chat = DB.getChatById(currentChatId);
      const disappearTimer = chat?.disappearTimer || 0;
      const message = {
        id: genMsgId(), text: sticker, type: 'sticker',
        senderId: currentUser.uid, senderName: currentUser.name,
        timestamp: Date.now(), readBy: [], reactions: {},
        isAdminMessage: isRootAdmin(),
        disappearAt: disappearTimer > 0 ? Date.now() + disappearTimer * 1000 : null
      };
      DB.addMessage(currentChatId, message);
      DB.updateChat(currentChatId, { lastMessage: { ...message, text: 'استیکر ' + sticker } });
      broadcast('messages-update', { chatId: currentChatId });
      renderMessages(currentChatId);
      renderChats();
      picker.remove();
    };
    picker.appendChild(btn);
  });
  document.querySelector('.message-input-area').appendChild(picker);
  setTimeout(() => document.addEventListener('click', (e) => {
    if (!picker.contains(e.target) && e.target.id !== 'stickerBtn') picker.remove();
  }, { once: true }), 10);
}

      const selected = Array.from(modal.querySelectorAll('input[type=checkbox]:checked')).map(c => c.value);
      if (selected.length === 0) { notify('عضو انتخاب کن'); return; }
      const chat = DB.addGroup(name, selected, currentUser.uid);
      broadcast('chats-update');
      modal.remove();
      renderChats();
      openChat(DB.getChatById(chat.id));
    };
    document.body.appendChild(modal);
  });
};

$('myProfileBtn').onclick = () => {
  const isRoot = isRootAdmin();
  const isFull = isFullAdmin(currentUser);
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="modal-content">
      <div class="modal-header"><h3>پروفایل من</h3><button class="close-btn">✕</button></div>
      <div class="profile-header" style="${isRoot || isFull ? 'background:linear-gradient(135deg, #f59e0b, #ef4444);' : ''}">
        <div class="avatar ${isRoot || isFull ? 'admin-avatar' : ''}" id="myProfileAvatar" style="margin:0 auto 15px;">${escapeHtml((currentUser.name || 'ک')[0].toUpperCase())}</div>
        <h2>${escapeHtml(currentUser.name)} ${isRoot ? '👑' : (isFull ? '🛡️' : '')}</h2>
        <p>@${escapeHtml(currentUser.username)}</p>
        <div class="edit-badge" id="changeMyAvatar">🖼️ عکس</div>
      </div>
      <div class="modal-body">
        <label>نام نمایشی</label>
        <input type="text" id="editName" value="${escapeHtml(currentUser.name)}" maxlength="50">
        <label>بیوگرافی</label>
        <textarea id="editBio" rows="3" maxlength="300">${escapeHtml(currentUser.bio || '')}</textarea>
        <button class="primary-btn" id="saveProfile">💾 ذخیره</button>
        <div style="height:1px;background:var(--border);margin:20px 0;"></div>
        <button class="primary-btn" id="changePasswordBtn" style="background:linear-gradient(135deg, #f59e0b, #ef4444);">🔑 تغییر رمز</button>
        ${!isRoot ? `<button class="primary-btn danger-btn" id="deleteAccountBtn" style="margin-top:10px;">🗑️ حذف حساب</button>` : ''}
      </div>
    </div>
  `;
  modal.querySelector('.close-btn').onclick = () => modal.remove();
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });

  const avatarEl = modal.querySelector('#myProfileAvatar');
  const imgSrc = getImageSrc(currentUser.photoURL);
  if (imgSrc) avatarEl.innerHTML = `<img src="${imgSrc}" alt="">`;

  modal.querySelector('#changeMyAvatar').onclick = () => {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*';
    input.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file || file.size > 2 * 1024 * 1024) { notify('عکس زیر ۲ مگ'); return; }
      const reader = new FileReader();
      reader.onload = async (ev) => {
        const ref = await saveImage(ev.target.result);
        DB.updateUser(currentUser.uid, { photoURL: ref });
        currentUser = DB.getCurrentUser();
        window.currentUser = currentUser;
        broadcast('users-update');
        loadMyProfile();
        avatarEl.innerHTML = `<img src="${getImageSrc(ref)}">`;
      };
      reader.readAsDataURL(file);
    };
    input.click();
  };

  modal.querySelector('#saveProfile').onclick = () => {
    const name = modal.querySelector('#editName').value.trim();
    const bio = modal.querySelector('#editBio').value.trim();
    if (!name) { notify('نام خالی'); return; }
    DB.updateUser(currentUser.uid, { name, bio });
    currentUser = DB.getCurrentUser();
    window.currentUser = currentUser;
    broadcast('users-update');
    loadMyProfile();
    modal.remove();
  };

  modal.querySelector('#changePasswordBtn').onclick = () => { modal.remove(); showChangePasswordModal(); };

  const delBtn = modal.querySelector('#deleteAccountBtn');
  if (delBtn) delBtn.onclick = () => {
    if (!confirm('مطمئنی؟')) return;
    if (!confirm('آخرین اخطار!')) return;
    deleteMyAccount();
    modal.remove();
  };
  document.body.appendChild(modal);
};

async function showChangePasswordModal() {
  if (!currentUser) return;
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="modal-content">
      <div class="modal-header"><h3>🔑 تغییر رمز</h3><button class="close-btn">✕</button></div>
      <div class="modal-body">
        <div id="changePwdError" style="color:#ef4444;font-size:13px;margin-bottom:12px;min-height:18px;text-align:center;"></div>
        <label>رمز فعلی</label>
        <input type="password" id="currentPwd">
        <label>رمز جدید</label>
        <input type="password" id="newPwd">
        <label>تکرار رمز جدید</label>
        <input type="password" id="confirmNewPwd">
        <button class="primary-btn" id="saveNewPwd">💾 ذخیره</button>
      </div>
    </div>
  `;
  modal.querySelector('.close-btn').onclick = () => modal.remove();
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });

  const errEl = modal.querySelector('#changePwdError');
  modal.querySelector('#saveNewPwd').onclick = async () => {
    const c = modal.querySelector('#currentPwd').value;
    const n = modal.querySelector('#newPwd').value;
    const cf = modal.querySelector('#confirmNewPwd').value;
    errEl.textContent = '';
    const fresh = DB.getUserById(currentUser.uid);
    const v = await verifyPassword(c, fresh.password);
    if (!v.match) { errEl.textContent = 'رمز فعلی اشتباه'; return; }
    if (n.length < 6) { errEl.textContent = 'رمز جدید حداقل ۶'; return; }
    if (n !== cf) { errEl.textContent = 'تکرار یکسان نیست'; return; }
    const newHash = await hashPassword(n);
    DB.updateUser(currentUser.uid, { password: newHash });
    currentUser = DB.getCurrentUser();
    window.currentUser = currentUser;
    errEl.style.color = '#4ade80';
    errEl.textContent = '✅ تغییر کرد!';
    setTimeout(() => { modal.remove(); notify('✅ رمز عوض شد'); }, 1000);
  };
  document.body.appendChild(modal);
}

function deleteMyAccount() {
  if (!currentUser || isRootAdmin()) return;
  const myUid = currentUser.uid;
  const chats = DB.getChats();
  chats.forEach(chat => {
    if (!chat.participants.includes(myUid)) return;
    const messages = DB.getMessages(chat.id);
    DB.saveMessages(chat.id, messages.filter(m => m.senderId !== myUid));
  });
  const updatedChats = [];
  chats.forEach(chat => {
    if (!chat.participants.includes(myUid)) { updatedChats.push(chat); return; }
    if (chat.type === 'private') localStorage.removeItem('chat_messages_' + chat.id);
    else if (chat.type === 'group') {
      chat.participants = chat.participants.filter(p => p !== myUid);
      chat.admins = (chat.admins || []).filter(a => a !== myUid);
      if (chat.participants.length === 0) localStorage.removeItem('chat_messages_' + chat.id);
      else updatedChats.push(chat);
    }
  });
  DB.saveChats(updatedChats);
  const users = DB.getUsers();
  DB.saveUsers(users.filter(u => u.uid !== myUid).map(u => {
    if (u.blocked) u.blocked = u.blocked.filter(id => id !== myUid);
    if (u.contacts) u.contacts = u.contacts.filter(id => id !== myUid);
    return u;
  }));
  broadcast('users-update');
  DB.clearCurrentUser();
  localStorage.removeItem('savedUsername');
  setTimeout(() => location.reload(), 500);
}

$('logoutBtn').onclick = () => {
  if (!confirm('خارج می‌شی؟')) return;
  if (currentUser) DB.updateUser(currentUser.uid, { isOnline: false, lastSeen: Date.now() });
  DB.clearCurrentUser();
  location.reload();
};
